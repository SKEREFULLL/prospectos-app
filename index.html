<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prospectos</title>
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F11" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --ink:#111316; --soft:#6B7079; --faint:#ECEDEF; --line:#E4E5E8;
  --wa:#17A34A; --ok:#17A34A; --warn:#D08A0E; --off:#A3A7AE;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E0F11; --surface:#16181B; --ink:#F1F2F4; --soft:#8D929B; --faint:#202328; --line:#24272C;
  --wa:#2BC466; --ok:#2BC466; --warn:#E9A93A; --off:#6A6F77; color-scheme:dark }}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:540px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:20px 6px;display:grid;gap:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1}
.count{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;text-align:right}
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;color:var(--soft);font:500 15px var(--font);padding:8px 0 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-variant-numeric:tabular-nums}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab small{font-size:12px;color:var(--soft);margin-left:3px}
.list{display:grid;grid-template-columns:minmax(0,1fr)}
.item{padding-block:18px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.who{min-width:0;flex:1 1 auto}
.name{font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0;line-height:1.2;overflow-wrap:anywhere}
.meta{overflow-wrap:anywhere;font-size:13px;color:var(--soft);margin-top:3px;font-variant-numeric:tabular-nums}
.state{flex:0 0 auto;max-width:50%;min-width:0;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--faint);color:var(--ink);font:500 13px var(--font);padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--off);flex:none}
.dot.warn{background:var(--warn)} .dot.ok{background:var(--ok)} .dot.new{background:var(--ink)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;height:46px;min-width:0;padding:0 6px;white-space:nowrap;border-radius:12px;font:600 14px var(--font);text-decoration:none;border:0;cursor:pointer;background:var(--faint);color:var(--ink)}
.btn.call{background:var(--ink);color:var(--bg)}
.btn.wa svg{color:var(--wa)}
.btn[aria-disabled="true"]{opacity:.3;pointer-events:none}
.btn svg{width:17px;height:17px;flex:none}
.btn .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:380px){.btn svg{display:none}.btn{font-size:13px}}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--font);padding:8px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.empty{color:var(--soft);padding:56px 0;display:grid;gap:6px;text-align:center}
.empty b{color:var(--ink);font-size:17px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:12px;font:500 14px var(--font);z-index:20;width:max-content;max-width:calc(100% - 36px);display:flex;align-items:center;gap:12px}
.toast button{border:0;background:none;color:var(--bg);font:700 14px var(--font);padding:6px 8px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:18px 18px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet h3{margin:0;font-size:18px;font-weight:600}
.sheet p{margin:0;color:var(--soft);font-size:14px}
.choices{display:grid;gap:8px}
.choice{height:50px;border-radius:12px;border:0;background:var(--faint);color:var(--ink);font:600 15px var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.choice{text-decoration:none;text-align:center;padding:0 12px}
.choice svg{width:18px;height:18px;flex:none}
.choice.primary{background:var(--ink);color:var(--bg)}
.choice.ghost{background:none;color:var(--soft);height:40px}
.setup{padding-block:64px 24px;display:grid;gap:14px}
.setup input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:400 15px var(--font);padding:0 14px}
.when{font-size:13px;color:var(--warn);margin-top:3px;font-weight:500}
.when.soft{color:var(--soft);font-weight:400}
.when.due{color:var(--ink);font-weight:600}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.days .choice{height:44px}
.daysrow{display:flex;gap:8px}
.daysrow input{flex:1;min-width:0;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:400 15px var(--font);padding:0 14px}
.daysrow .choice{padding:0 18px}
.refresh{border:0;background:none;color:var(--soft);font:500 13px var(--font);padding:0;cursor:pointer}
.done{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chk{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;font:500 14px var(--font);cursor:pointer;user-select:none}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--ok);cursor:pointer}
.chk.on{color:var(--ok)}
.pass{min-height:42px;padding:6px 14px;line-height:1.15;border-radius:12px;border:0;font:600 14px var(--font);cursor:pointer;background:var(--ink);color:var(--bg)}
.pass:disabled{background:var(--faint);color:var(--off);cursor:default}
.msgbox{background:var(--faint);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--soft);line-height:1.35}
.pass.ghostish{background:var(--faint);color:var(--ink);justify-self:start}
.daysrow input[type=time]{flex:0 0 150px}
.search{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:400 15px var(--font);padding:0 14px;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastUndo" type="button" hidden>Deshacer</button></div>
<div id="sheet"></div>

<script>
const STATES = [
  {k:"Pendiente",c:"new"},{k:"No atendió",c:"warn"},{k:"WhatsApp enviado",c:"warn"},{k:"DM enviado",c:"warn"},
  {k:"Respondió",c:"ok"},{k:"Demo",c:"ok"},{k:"Cliente",c:"ok"},{k:"No interesa",c:"off"},
  {k:"Volver a contactar",c:"warn"}
];
const today = ()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDays = n=>{ const d=new Date(); d.setDate(d.getDate()+n); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const due = l=>l.estado==="Volver a contactar" && (!l.contactar || l.contactar<=today());
const TABS = [
  {k:"hoy",label:"Por contactar",test:l=>l.estado==="Pendiente"||l.estado==="No atendió"||due(l)},
  {k:"seg",label:"Seguimiento",test:l=>l.estado==="WhatsApp enviado"||l.estado==="DM enviado"||(l.estado==="Volver a contactar"&&!due(l))},
  {k:"demo",label:"Demos",test:l=>l.estado==="Demo"},
  {k:"cal",label:"Respondieron",test:l=>l.estado==="Respondió"||l.estado==="Demo"||l.estado==="Cliente"},
  {k:"todos",label:"Todos",test:()=>true}
];
// Fecha del último cambio: la trae la planilla; si no, se guarda en el celular como respaldo
let localCambios = {}; try{ localCambios = JSON.parse(localStorage.getItem("cambios")||"{}"); }catch(e){}
const cambioDe = l=>l.cambio || localCambios[l.fila] || "";
const fdate = s=>{ if(!s) return ""; const [y,m,d]=s.split("-"); return `${d}/${m}`; };
function whenLabel(l){
  if(l.estado!=="Volver a contactar" || !l.contactar) return "";
  const t=today(); if(l.contactar<t) return "Atrasado, tocaba el "+fdate(l.contactar);
  if(l.contactar===t) return "Contactar hoy";
  const days=Math.round((new Date(l.contactar)-new Date(t))/864e5);
  return days===1?"Contactar mañana":`Contactar en ${days} días (${fdate(l.contactar)})`;
}
// Demos: "2026-10-30T10:00" (hora de Argentina)
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const demoDia = l=>(l.demo||"").slice(0,10), demoHora = l=>(l.demo||"").slice(11,16);
function diaTexto(f){ // "hoy", "mañana", "el viernes 31/10"
  if(f===today()) return "hoy"; if(f===addDays(1)) return "mañana";
  const [y,m,d]=f.split("-").map(Number); return `el ${DIAS[new Date(y,m-1,d).getDay()]} ${fdate(f)}`;
}
function demoLabel(l){
  if(!l.demo) return l.estado==="Demo" ? "Sin día ni hora: tocá Cambiar horario" : "";
  const f=demoDia(l), h=demoHora(l);
  if(f<today()) return `Fue el ${fdate(f)} a las ${h}`;
  const t=diaTexto(f); return `${t[0].toUpperCase()+t.slice(1)} a las ${h}`;
}
const demoPasada = l=>!l.demo || demoDia(l)<today();
function demoMsg(l){
  const f=demoDia(l), h=demoHora(l);
  if(!l.demo || f<=today()) return `Hola, te espero a las ${h||"…"}, en breves te mando el link del Meet`;
  return `Hola, ¿cómo andás? Te confirmo la demo ${diaTexto(f).replace(/^el /,"del ").replace(/^mañana/,"de mañana")} a las ${h}. Te mando el link del Meet un rato antes.`;
}
const DEFAULT_MSG = "Hola, como están? me llamo Joaquin y desarrollo software\n\nVi que hacen muebles a medida e hice un programa que arma el presupuesto, el despiece y el plano de corte en menos de 5 minutos, sin tener que modelar pieza por pieza en SketchUp\n\n¿Les gustaría ver como lo hace con uno de sus proyectos?";
const I = {
  call:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.4 1.8 2.2 1.2 1.1 2.2 1.4 2.5 1.6.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.6-.1 1.2z"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>'
};
const store = {
  get(k){ try{return localStorage.getItem(k)}catch(e){return null} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
};
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = p=>{ if(!p) return ""; const m=String(p).match(/^54(9?)(\d{2,4})(\d{6,8})$/); return m?`+54 ${m[1]?"9 ":""}${m[2]} ${m[3]}`:"+"+p; };

// Conexión: llega una sola vez por el link #c=URL|CLAVE y queda guardada en el celular
(function(){
  const h = location.hash.match(/^#c=(.+)$/);
  if(h){ store.set("conexion", decodeURIComponent(h[1])); history.replaceState(null,"",location.pathname); }
})();
let API=null, KEY=null;
function loadConn(){ const c=store.get("conexion"); if(!c||!c.includes("|")) return false; [API,KEY]=c.split("|"); return true; }

let leads = [], msg = DEFAULT_MSG, tab = store.get("filtro")||"hoy", open = null, loading = true, error = "", query = "";
// Check de "le escribí" en Por contactar: queda en el celular hasta que lo pasás a Seguimiento.
// Guarda por qué canal le escribiste (ig o wa) para ponerle el estado correcto al pasarlo.
let checks = {}; try{ checks = JSON.parse(localStorage.getItem("checks")||"{}"); }catch(e){}
const saveChecks = ()=>store.set("checks", JSON.stringify(checks));
function marcar(lead, canal){ checks[lead.fila] = canal; saveChecks(); render(); }
const sinAcentos = s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
try{ const cached = JSON.parse(store.get("cache")||"null"); if(cached){ leads=cached.filas||[]; msg=cached.mensaje||DEFAULT_MSG; loading=false; } }catch(e){}

async function api(params){
  const q = new URLSearchParams({k:KEY, ...params});
  const r = await fetch(`${API}?${q}`, {redirect:"follow"});
  const j = await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}
let serverV = Number(store.get("serverV")||1);
async function refresh(){
  try{
    const j = await api({});
    leads = j.filas||[]; msg = j.mensaje||DEFAULT_MSG; serverV = j.v||1; store.set("serverV", String(serverV)); error=""; loading=false;
    store.set("cache", JSON.stringify(j));
  }catch(e){ error = e.message==="clave" ? "clave" : "red"; loading=false; }
  render();
}
async function setState(lead, next, {undo=true, label, contactar="", demo}={}){
  const prev = lead.estado, prevC = lead.contactar||"", prevCambio = lead.cambio||"", prevD = lead.demo||"";
  if(prev===next && prevC===contactar && (demo===undefined || demo===prevD)) return;
  if(demo!==undefined) lead.demo = demo; else if(next!=="Demo" && lead.demo && lead.demo.slice(0,10)>=today()) lead.demo = "";
  if(checks[lead.fila]){ delete checks[lead.fila]; saveChecks(); }
  lead.estado = next; lead.contactar = contactar; lead.cambio = today();
  localCambios[lead.fila] = lead.cambio; store.set("cambios", JSON.stringify(localCambios));
  open=null; render(); store.set("cache", JSON.stringify({filas:leads,mensaje:msg}));
  toast(label || `${lead.nombre}: ${next}`, undo ? ()=>{ setState(lead, prev, {undo:false, label:"Listo, lo volví atrás", contactar:prevC, demo: prev==="Demo" && prevD ? prevD : undefined}); } : null);
  try{ await api({fila:lead.fila, estado:next, contactar, ...(next==="Demo" && demo ? {demo} : {})}); }
  catch(e){ lead.estado = prev; lead.contactar = prevC; lead.cambio = prevCambio; lead.demo = prevD; render(); toast("No se pudo guardar. Revisá la conexión y probá de nuevo."); }
}

function askDays(lead){
  const el=document.getElementById("sheet");
  el.innerHTML = `<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-label="Volver a contactar">
    <h3>¿En cuántos días volvés a contactar a ${esc(lead.nombre)}?</h3>
    <div class="days">${[1,2,3,7,15,30].map(n=>`<button class="choice" type="button" data-d="${n}">${n}</button>`).join("")}</div>
    <div class="daysrow"><input id="daysIn" type="number" inputmode="numeric" min="1" max="365" placeholder="Otro número de días"><button class="choice primary" id="daysOk" type="button">Listo</button></div>
    <button class="choice ghost" type="button" id="daysX">Cancelar</button>
  </div></div>`;
  const close=()=>{ el.innerHTML=""; };
  const go=n=>{ n=Math.round(Number(n)); if(!(n>=1&&n<=365)){ toast("Poné un número de días entre 1 y 365."); return; } close(); const f=addDays(n); setState(lead,"Volver a contactar",{contactar:f,label:`${lead.nombre}: contactar el ${fdate(f)}`}); };
  el.querySelector("#bg").onclick=e=>{ if(e.target.id==="bg") close(); };
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>go(b.dataset.d));
  el.querySelector("#daysOk").onclick=()=>go(el.querySelector("#daysIn").value);
  el.querySelector("#daysX").onclick=close;
}

function askDemo(lead){
  const el=document.getElementById("sheet");
  const f0 = lead.demo && demoDia(lead)>=today() ? demoDia(lead) : addDays(1), h0 = demoHora(lead) || "10:00";
  el.innerHTML = `<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-label="Agendar demo">
    <h3>Demo con ${esc(lead.nombre)}</h3>
    <div class="days" style="grid-template-columns:repeat(3,1fr)">${[["Hoy",0],["Mañana",1],["Pasado",2]].map(([t,n])=>`<button class="choice" type="button" data-f="${addDays(n)}">${t}</button>`).join("")}</div>
    <div class="daysrow"><input id="demoF" type="date" value="${f0}" min="${today()}" aria-label="Día"><input id="demoH" type="time" value="${h0}" step="900" aria-label="Hora"></div>
    <button class="choice primary" id="demoOk" type="button">Agendar</button>
    <p>Se crea un aviso en tu Google Calendar: el día anterior (si no es hoy) y 1 hora antes.</p>
    <button class="choice ghost" type="button" id="demoX">Cancelar</button>
  </div></div>`;
  const close=()=>{ el.innerHTML=""; };
  const fIn=el.querySelector("#demoF"), hIn=el.querySelector("#demoH");
  const marcarDia=()=>el.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("primary", b.dataset.f===fIn.value));
  marcarDia(); fIn.onchange=marcarDia;
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ fIn.value=b.dataset.f; marcarDia(); });
  el.querySelector("#bg").onclick=e=>{ if(e.target.id==="bg") close(); };
  el.querySelector("#demoX").onclick=close;
  el.querySelector("#demoOk").onclick=()=>{
    const f=fIn.value, h=hIn.value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(f) || !/^\d{2}:\d{2}$/.test(h)){ toast("Elegí el día y la hora."); return; }
    if(f<today()){ toast("Ese día ya pasó."); return; }
    close(); const d=`${f}T${h}`;
    setState(lead,"Demo",{demo:d, label:`Demo con ${lead.nombre}: ${diaTexto(f)} a las ${h}`});
  };
}

// Antes del primer DM del día, confirmar que Instagram esté en la cuenta de la empresa
const IG_ACCOUNT = "joaquin.software";
function askIgAccount(lead, href){
  const el=document.getElementById("sheet");
  el.innerHTML = `<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-label="Cuenta de Instagram">
    <h3>¿Instagram está en @${IG_ACCOUNT}?</h3>
    <p><b>Si estás en @joaquin.lls u otra cuenta, no mandes.</b> La app abre Instagram con la última cuenta que usaste y no puede ver cuál es. Para cambiar: en Instagram mantené apretada tu foto de perfil abajo a la derecha y elegí @${IG_ACCOUNT}.</p>
    <div class="choices">
      <a class="choice primary" id="igYes" href="${esc(href)}" target="_blank" rel="noopener">${I.ig}Sí, abrir el chat</a>
      <button class="choice ghost" type="button" id="igNo">Primero cambio de cuenta</button>
    </div>
  </div></div>`;
  const close=()=>{ el.innerHTML=""; };
  el.querySelector("#bg").onclick=e=>{ if(e.target.id==="bg") close(); };
  el.querySelector("#igNo").onclick=close;
  el.querySelector("#igYes").onclick=()=>{ store.set("igOkAt", String(Date.now())); close(); sendIg(lead); };
}
function sendIg(lead){
  if(tab==="demo" && lead.estado==="Demo"){ navigator.clipboard?.writeText(demoMsg(lead)).catch(()=>{}); toast("Mensaje copiado. Pegalo en el chat y mandalo."); return; }
  navigator.clipboard?.writeText(msg).catch(()=>{});
  if(TABS[0].test(lead)){ marcar(lead,"ig"); toast("Mensaje copiado. Cuando lo mandes, tocá Pasar a Seguimiento."); }
  else toast("Mensaje copiado. Pegalo en el chat y mandalo.");
}
function sendWa(lead){
  if(TABS[0].test(lead)){ marcar(lead,"wa"); toast("Cuando lo mandes, tocá Pasar a Seguimiento."); }
}
function pasar(lead){
  const canal = checks[lead.fila] || (lead.ig && !lead.tel ? "ig" : lead.tel ? "wa" : "ig");
  setState(lead, canal==="ig" ? "DM enviado" : "WhatsApp enviado", {label:`${lead.nombre}: pasado a Seguimiento`});
}

let tt;
function toast(text, onUndo){
  const t=document.getElementById("toast"), u=document.getElementById("toastUndo");
  document.getElementById("toastText").textContent=text;
  u.hidden=!onUndo; u.onclick=()=>{ t.hidden=true; onUndo&&onUndo(); };
  t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true, onUndo?5000:2600);
}

function renderSetup(){
  document.getElementById("app").innerHTML = `<div class="setup">
    <h1>Prospectos</h1>
    <p style="color:var(--soft);margin:0">Pegá el link de conexión que te pasó Claude. Se guarda en el celular y no lo tenés que poner de nuevo.</p>
    <input id="connIn" type="url" placeholder="Link de conexión" autocomplete="off">
    <button class="choice primary" id="connBtn" type="button">Conectar</button>
  </div>`;
  document.getElementById("connBtn").onclick=()=>{
    let v=document.getElementById("connIn").value.trim();
    const m=v.match(/#c=(.+)$/); if(m) v=decodeURIComponent(m[1]);
    if(!v.includes("|")){ toast("Ese link no sirve. Copiá el link completo que te pasó Claude."); return; }
    store.set("conexion", v); loadConn(); loading=true; render(); refresh();
  };
}

function render(){
  if(!API){ renderSetup(); return; }
  const app=document.getElementById("app");
  if(!app.querySelector("header")){
    app.innerHTML = `<header>
      <div class="top"><h1>Prospectos</h1><div class="count"><div id="summary"></div><button class="refresh" id="refreshBtn" type="button">Actualizar</button></div></div>
      <nav class="tabs" id="tabs" aria-label="Filtrar"></nav>
      <input class="search" id="search" type="search" placeholder="Buscar por nombre, Instagram o teléfono" aria-label="Buscar" autocomplete="off" hidden>
    </header><main class="list" id="list" aria-live="polite"></main>`;
    document.getElementById("search").oninput=e=>{ query=e.target.value; render(); };
    document.getElementById("tabs").onclick=e=>{ const b=e.target.closest(".tab"); if(!b) return; tab=b.dataset.t; open=null; store.set("filtro",tab); render(); window.scrollTo({top:0}); };
    document.getElementById("refreshBtn").onclick=()=>{ document.getElementById("summary").textContent="Actualizando…"; refresh(); };
    document.getElementById("list").onclick=onListClick;
  }
  const cnt = k=>leads.filter(l=>TABS.find(t=>t.k===k).test(l)).length;
  document.getElementById("tabs").innerHTML = TABS.map(t=>`<button class="tab" type="button" data-t="${t.k}" aria-pressed="${t.k===tab}">${t.label}<small>${cnt(t.k)}</small></button>`).join("");
  const pend = leads.filter(l=>l.estado==="Pendiente").length;
  document.getElementById("summary").textContent = leads.length ? `${pend} sin tocar de ${leads.length}` : "";
  const list=document.getElementById("list");
  if(loading && !leads.length){ list.innerHTML=`<div class="empty"><b>Cargando la lista</b><span>Trayendo los talleres de tu planilla.</span></div>`; return; }
  if(error==="clave"){ list.innerHTML=`<div class="empty"><b>La conexión no es válida</b><span>Abrí de nuevo el link de conexión que te pasó Claude.</span></div>`; return; }
  if(error && !leads.length){ list.innerHTML=`<div class="empty"><b>No hay conexión</b><span>Revisá internet y tocá Actualizar.</span></div>`; return; }
  const t=TABS.find(x=>x.k===tab)||TABS[0];
  let rows=leads.filter(l=>t.test(l));
  const buscar = tab==="seg";
  document.getElementById("search").hidden = !buscar;
  const q = buscar ? sinAcentos(query.trim()) : "";
  if(q){ const qd=q.replace(/\D/g,""); rows = rows.filter(l=>sinAcentos(l.nombre).includes(q) || sinAcentos(l.ig).includes(q.replace(/^@/,"")) || (qd.length>=3 && String(l.tel||"").includes(qd))); }
  if(q && !rows.length){ list.innerHTML=`<div class="empty"><b>No encontré “${esc(query.trim())}”</b><span>Probá con otra parte del nombre o del Instagram.</span></div>`; return; }
  if(tab==="demo"){ rows = [...rows.filter(l=>!demoPasada(l)).sort((a,b)=>a.demo.localeCompare(b.demo)), ...rows.filter(demoPasada).sort((a,b)=>(b.demo||"").localeCompare(a.demo||""))]; }
  else if(tab==="hoy"){ rows = [...rows.filter(due).sort((a,b)=>(a.contactar||"").localeCompare(b.contactar||"")), ...rows.filter(l=>!due(l))]; }
  else if(tab!=="todos"){ rows = rows.map((l,i)=>[l,i]).sort((a,b)=>cambioDe(b[0]).localeCompare(cambioDe(a[0])) || b[1]-a[1]).map(x=>x[0]); }
  if(!rows.length){ list.innerHTML=`<div class="empty"><b>${tab==="hoy"?"Contactaste a todos":tab==="demo"?"No hay demos agendadas":"Nada por acá"}</b><span>${tab==="hoy"?"Pedile a Claude que prospecte más.":tab==="demo"?"Cuando alguien acepte, tocá su estado y elegí Demo.":"Cuando cambies un estado, aparece en esta lista."}</span></div>`; return; }
  list.innerHTML = rows.map(l=>{
    const d=STATES.find(s=>s.k===l.estado)||STATES[0], isOpen=open===l.fila;
    const meta=[fmt(l.tel), l.ig?"@"+l.ig:""].filter(Boolean).join("  ·  ");
    const enDemos = tab==="demo" && l.estado==="Demo";
    const when = (l.estado==="Demo" && demoLabel(l)) || whenLabel(l) || ((l.estado!=="Pendiente" && cambioDe(l)) ? `Último contacto: ${fdate(cambioDe(l))}` : "");
    const wa = l.tel?`https://wa.me/${l.tel}?text=${encodeURIComponent(enDemos?demoMsg(l):msg)}`:"#";
    const ig = l.ig?`https://ig.me/m/${encodeURIComponent(l.ig)}`:"#";
    return `<article class="item" data-f="${l.fila}">
      <div class="row">
        <div class="who"><h2 class="name">${esc(l.nombre)}</h2>${meta?`<div class="meta">${esc(meta)}</div>`:""}${when?`<div class="when${due(l)||(l.estado==="Demo"&&demoDia(l)===today())?" due":""}${whenLabel(l)||(l.estado==="Demo"&&!demoPasada(l))?"":" soft"}">${esc(when)}</div>`:""}</div>
        <button class="state" type="button" data-act="toggle" aria-expanded="${isOpen}"><span class="dot ${d.c}"></span><span class="lbl" style="overflow:hidden;text-overflow:ellipsis">${esc(l.estado)}</span></button>
      </div>
      ${isOpen?`<div class="picker" role="group" aria-label="Cambiar estado">${STATES.filter(s=>s.k!=="Volver a contactar").map(s=>`<button class="opt" type="button" data-s="${esc(s.k)}" aria-pressed="${s.k===l.estado}"><span class="dot ${s.c}"></span>${esc(s.k)}</button>`).join("")}${serverV>=2?`<button class="opt" type="button" data-act="days" aria-pressed="${l.estado==="Volver a contactar"}"><span class="dot warn"></span>Contactar en…</button>`:""}</div>`:""}
      <div class="acts">
        <a class="btn call" href="${l.tel?"tel:+"+esc(l.tel):"#"}" data-act="call" aria-disabled="${!l.tel}">${I.call}<span class="lbl">Llamar</span></a>
        <a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener" data-act="wa" aria-disabled="${!l.tel}">${I.wa}<span class="lbl">WhatsApp</span></a>
        <a class="btn" href="${esc(ig)}" target="_blank" rel="noopener" data-act="ig" aria-disabled="${!l.ig}">${I.ig}<span class="lbl">Instagram</span></a>
      </div>
      ${enDemos && !demoPasada(l)?`<div class="msgbox">${esc(demoMsg(l))}</div>`:""}
      ${enDemos?`<button class="pass ghostish" type="button" data-act="horario">Cambiar horario</button>`:""}
      ${TABS[0].test(l)?`<div class="done">
        <label class="chk${checks[l.fila]?" on":""}"><input type="checkbox" data-act="check" ${checks[l.fila]?"checked":""}>Le escribí</label>
        <button class="pass" type="button" data-act="pasar" ${checks[l.fila]?"":"disabled"}>Pasar a Seguimiento</button>
      </div>`:""}
    </article>`;
  }).join("");
}

let pendingCall = null;
function onListClick(e){
  const item=e.target.closest(".item"); if(!item) return;
  const lead=leads.find(l=>String(l.fila)===item.dataset.f); if(!lead) return;
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="toggle"){ open = open===lead.fila?null:lead.fila; render(); return; }
  if(act==="call"){ pendingCall = lead; return; } // el link abre el teléfono; al volver, preguntamos cómo salió
  if(act==="wa"){ sendWa(lead); return; }
  if(act==="check"){ if(e.target.checked) marcar(lead, lead.ig && !lead.tel ? "ig" : lead.tel ? "wa" : "ig"); else { delete checks[lead.fila]; saveChecks(); render(); } return; }
  if(act==="pasar"){ pasar(lead); return; }
  if(act==="days"){ open=null; render(); askDays(lead); return; }
  if(act==="horario"){ askDemo(lead); return; }
  if(act==="ig"){
    if(Date.now()-Number(store.get("igOkAt")||0) > 10*60*1000){ e.preventDefault(); askIgAccount(lead, e.target.closest("a").href); return; }
    sendIg(lead);
    return;
  }
  const o=e.target.closest(".opt"); if(!o) return;
  if(o.dataset.s==="Demo" && serverV>=3){ open=null; render(); askDemo(lead); return; }
  setState(lead, o.dataset.s, {undo:false});
}

function askCall(lead){
  const el=document.getElementById("sheet");
  const hasWa = !!lead.tel;
  el.innerHTML = `<div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-label="Resultado de la llamada">
    <h3>¿Cómo salió con ${esc(lead.nombre)}?</h3>
    <div class="choices">
      ${hasWa?`<a class="choice primary" id="cWa" href="https://wa.me/${lead.tel}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${I.wa}No atendió, mandar WhatsApp</a>`:""}
      <button class="choice" type="button" data-s="No atendió">No atendió</button>
      <button class="choice" type="button" data-s="Respondió">Hablamos, le interesa</button>
      <button class="choice" type="button" data-s="No interesa">No le interesa</button>
      <button class="choice ghost" type="button" data-s="">Cerrar</button>
    </div>
  </div></div>`;
  const close=()=>{ el.innerHTML=""; };
  el.querySelector("#bg").onclick=e=>{ if(e.target.id==="bg") close(); };
  el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ close(); if(b.dataset.s) setState(lead,b.dataset.s); });
  const w=el.querySelector("#cWa"); if(w) w.onclick=()=>{ close(); if(TABS[0].test(lead)) sendWa(lead); else setState(lead,"WhatsApp enviado",{label:`WhatsApp a ${lead.nombre} marcado como enviado`}); };
}
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    if(pendingCall){ const l=pendingCall; pendingCall=null; askCall(l); }
    else if(API) refresh();
  }
});

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(loadConn()){ render(); refresh(); } else { render(); }
</script>
</body>
</html>
