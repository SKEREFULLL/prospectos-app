<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WhatsApp · Pruebas CRM</title>
<style>body{font:16px system-ui;max-width:760px;margin:32px auto;padding:0 16px;background:#101418;color:#eee}input,textarea,button,select{font:inherit;padding:10px;margin:5px 0;max-width:100%;box-sizing:border-box}input,textarea{width:100%}textarea{min-height:110px}article{border:1px solid #566;padding:16px;margin:16px 0;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}#status{color:#9ed4ff}</style>
<h1>WhatsApp · Pruebas CRM</h1><p>Solo número de prueba. Cada envío requiere revisar y aprobar su destinatario y contenido.</p>
<label>Clave de administración<input id="token" type="password" autocomplete="off"></label><button id="load">Conectar / Actualizar</button><p id="status" role="status"></p>
<form id="draft"><h2>Preparar mensaje</h2><label>Destinatario internacional<input id="to" placeholder="Solo un destinatario autorizado para pruebas" required></label>
<label>Tipo<select id="type"><option value="text">Texto (requiere mensaje recibido en las últimas 24 horas)</option><option value="template">Plantilla aprobada</option></select></label>
<label>Texto o JSON de plantilla<textarea id="message" required></textarea></label><button>Guardar borrador, sin enviar</button></form>
<h2>Borradores</h2><div id="drafts"></div><h2>Eventos recibidos</h2><div id="events"></div>
<script type="module">
const $=id=>document.getElementById(id);const status=text=>$('status').textContent=text;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error);return j;}
function pre(value){const p=document.createElement('pre');p.textContent=typeof value==='string'?value:JSON.stringify(value,null,2);return p;}
async function load(){try{const s=await api('/api/state');status('Modo prueba · '+(s.sends_enabled?'Envíos habilitados con aprobación':'Envíos desactivados'));$('drafts').replaceChildren();$('events').replaceChildren();for(const d of s.drafts){const card=document.createElement('article');card.append(pre({destinatario:d.phone,estado:d.state,mensaje:JSON.parse(d.payload),id:d.id}));if(d.state==='pending'){const b=document.createElement('button');b.textContent='Revisar y aprobar este envío';b.onclick=async()=>{if(!confirm('Se enviará por WhatsApp al '+d.phone+' exactamente este contenido:\n'+d.payload))return;b.disabled=true;try{await api('/api/drafts/'+d.id+'/approve',{confirm:d.id});await load();}catch(e){status(e.message);}};card.append(b);const cancel=document.createElement('button');cancel.textContent='Descartar';cancel.onclick=async()=>{try{await api('/api/drafts/'+d.id+'/cancel',{});await load();}catch(e){status(e.message);}};card.append(cancel);}$('drafts').append(card);}for(const e of s.events){const card=document.createElement('article');card.append(pre({evento:e.kind,telefono:e.phone,datos:JSON.parse(e.payload)}));$('events').append(card);}}catch(e){status(e.message);}}
$('load').onclick=load;$('draft').onsubmit=async e=>{e.preventDefault();try{const type=$('type').value;const body={to:$('to').value,type,...(type==='text'?{text:$('message').value}:{template:JSON.parse($('message').value)})};await api('/api/drafts',body);await load();}catch(e){status(e.message);}};
</script></html>
