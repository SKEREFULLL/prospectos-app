# Publica la app en GitHub Pages cada vez que cambia main (y a mano desde Actions).
# Hace falta porque los cambios subidos desde las sesiones de Claude no disparan la publicación automática de Pages.
name: Publicar la app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publicar
        uses: actions/deploy-pages@v4
